<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DSA Importer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><span class="eyebrow">PERSONAL DEV KG</span><h1>LeetCode Importer</h1></header>
      <div id="notice" class="notice hidden"></div>

      <section id="pairing" class="hidden">
        <p>Generate a pairing code from the DSA tracker, then enter it here.</p>
        <label>API origin<input id="api-origin" value="http://localhost:8000" /></label>
        <label>Pairing code<input id="pair-code" maxlength="16" placeholder="ABCD2345" /></label>
        <button id="pair">Pair extension</button>
      </section>

      <section id="offsite" class="hidden">
        <p>Open LeetCode in this tab to capture or import solved problems.</p>
        <button id="open-leetcode">Open LeetCode</button>
      </section>

      <section id="logged-out" class="hidden">
        <p>Log in to LeetCode in this tab. Your cookies never leave LeetCode.</p>
        <button id="login">Log in to LeetCode</button>
      </section>

      <section id="problem" class="hidden">
        <div class="problem-heading"><div><span id="difficulty" class="pill"></span><h2 id="title"></h2></div><span id="tracker-status" class="muted"></span></div>
        <label>Tracker tags<input id="tracker-tags" placeholder="arrays, revisit" /></label>
        <label>My tracker note<textarea id="tracker-note" rows="4" placeholder="What did you learn?"></textarea></label>
        <button id="capture">Capture problem</button>
      </section>

      <section id="importer" class="hidden">
        <div class="row"><strong>Solved history</strong><span id="progress-label" class="muted"></span></div>
        <progress id="progress" max="1" value="0"></progress>
        <button id="import-all">Import all solved problems</button>
        <div class="button-row">
          <button id="pause" class="secondary">Pause</button>
          <button id="resume" class="secondary">Resume</button>
          <button id="cancel" class="danger">Cancel</button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
